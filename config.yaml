app:
  name: "SIF Precursor AI Intelligence Platform"
  organization: "Oil India Limited"
  project: "Smart India Hackathon (SIH)"
  version: "2.0.0 Enterprise"
  default_theme: "dark"
  default_engine: "local"

security:
  auth_enabled: false  # Set to true to require PIN / Login
  default_pin: "1959"  # Oil India founding year
  session_timeout_minutes: 120

database:
  url: "sqlite:///data/sif_dashboard.db"
  echo_sql: false

llm:
  openai:
    default_model: "gpt-4o-mini"
    pricing:
      input_per_million: 0.15
      output_per_million: 0.60
  anthropic:
    default_model: "claude-3-haiku-20240307"
    pricing:
      input_per_million: 0.25
      output_per_million: 1.25
  ollama:
    base_url: "http://localhost:11434"
    default_model: "llama3"
  huggingface:
    model_url: "https://api-inference.huggingface.co/models/facebook/bart-large-mnli"

severity_thresholds:
  critical_min_score: 80
  potential_min_score: 50

high_energy_sources:
  "Fall from Height":
    weight: 9
    keywords: ["fall", "falling", "height", "scaffold", "harness", "ladder", "roof", "edge", "elevated", "platform", "gir gaya", "girna", "uchai", "uncha", "chhat"]
